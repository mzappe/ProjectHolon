<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Art Viewer Index</title>
    <style>
        
:root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
}

body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

header {
    text-align: center;
    padding: 40px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
}

h1 {
    font-size: 2.5rem;
    color: var(--accent);
    margin: 0;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
}

.card-item {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}

.card-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
}

.card-image-container {
    aspect-ratio: 5 / 7;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.card-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.card-details {
    padding: 15px;
}

.card-name {
    font-weight: 600;
    font-size: 1.1rem;
    margin-bottom: 5px;
    display: block;
}

.card-meta {
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.card-number {
    float: right;
    color: var(--accent);
}

        .set-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 40px auto;
        }
        .set-link {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.2rem;
            transition: border-color 0.2s, background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .set-link:hover {
            border-color: var(--accent);
            background-color: #1c2128;
        }
        .set-link::after {
            content: '→';
            color: var(--accent);
        }
    </style>
</head>
<body>
    <header>
        <h1>TCG Art Viewers</h1>
    </header>
    <div class="set-list">
        <a href="Pokemon-Delta-Species.html" class="set-link">Delta Species</a>
        <a href="Pokemon-Crystal-Guardians.html" class="set-link">Crystal Guardians</a>
        <a href="Pokemon-Dragon-Frontiers.html" class="set-link">Dragon Frontiers</a>
        <a href="Pokemon-Holon-Phantoms.html" class="set-link">Holon Phantoms</a>
        <a href="Pokemon-Legend-Maker.html" class="set-link">Legend Maker</a>

    </div>
</body>
</html>
